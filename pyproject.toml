[project]
name = "second-wind"
version = "0.0.1"
description = "A real-life game for people with ADHD, built for the moment interest drops."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: imports, B: bugbear, UP: pyupgrade, S: bandit-equivalent security rules
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
